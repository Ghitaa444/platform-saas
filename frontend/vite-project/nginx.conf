server {
    listen 80;
    server_name localhost;

    # 🧩 Répertoire du build frontend
    root /usr/share/nginx/html;
    index index.html;

    # ⚡ Routes du frontend SPA (React / Vite)
    location / {
        try_files $uri $uri/ /index.html;
        # 🚫 Désactive le cache sur index.html pour toujours charger la dernière version
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 🧱 Fichiers statiques (CSS, JS, images)
    location ~* \.(?:js|css|ico|png|jpg|jpeg|svg|gif|woff2?|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 🔗 Proxy vers le backend Flask
    location /api/ {
        # ⚠️ "/" final indispensable pour éviter /api/api/... (404)
        proxy_pass http://saas_backend_app:5000/;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 🚀 Empêche le cache sur les requêtes API
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 🌐 Redirige les erreurs 404 du frontend vers index.html
    error_page 404 /index.html;
}
