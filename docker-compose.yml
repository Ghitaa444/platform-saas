version: "3.9"

services:
  db:
    image: postgres:13-alpine
    container_name: saas_postgres_db
    environment:
      POSTGRES_DB: Saas_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Ritadev2025
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - saas_net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: saas_backend_app
    environment:
      FLASK_APP: app.py
      FLASK_ENV: development
      SQLALCHEMY_DATABASE_URI: postgresql://postgres:Ritadev2025@db:5432/Saas_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-defaultsecretkey}
      DOCKER_HOST_URI: unix://var/run/docker.sock
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - db
    ports:
      - "5000:5000"   # ✅ exposes backend to Codespaces
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`)"
      - "traefik.http.services.backend.loadbalancer.server.port=5000"
    networks:
      - saas_net

  frontend:
    build:
      context: ./frontend/vite-project
      dockerfile: Dockerfile
    container_name: saas_frontend
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    networks:
      - saas_net

  traefik:
    image: traefik:v3.0
    container_name: saas_traefik
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - saas_net

volumes:
  db_data:

networks:
  saas_net:
    driver: bridge
