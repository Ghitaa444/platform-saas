# docker-compose.yml (à la racine du projet SaaS)

services:
  db:
    image: postgres:13-alpine
    container_name: saas_postgres_db
    environment:
      POSTGRES_DB: Saas_db
      POSTGRES_USER: ${POSTGRES_USER} 
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} 
    ports:
      - "5432:5432" # Le port PostgreSQL est exposé
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app_network
    restart: unless-stopped

  backend: # C'est le nom de votre service backend !
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saas_backend # Ceci est juste le nom du conteneur, le nom du SERVICE est 'backend'
    ports:
      - "5000:5000"
    environment:
      FLASK_APP: backend/app.py
      FLASK_ENV: development
      # LA CORRECTION : Utilisez 'DATABASE_URL' pour correspondre à ce que 'os.getenv' cherche dans config.py
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/Saas_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      # CRUCIAL : Pour que votre service backend puisse interagir avec le démon Docker de l'hôte
      DOCKER_HOST: "unix:///var/run/docker.sock"
    depends_on:
      - db # S'assure que le service 'db' démarre avant 'backend'
    networks:
      - app_network
    # TRÈS IMPORTANT : Monte le socket Docker de l'hôte dans le conteneur,
    # permettant au backend Flask d'exécuter des commandes Docker (via DockerService).
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  db_data: # Volume pour persister les données PostgreSQL

networks:
  app_network:
    driver: bridge # Réseau interne pour la communication entre les services